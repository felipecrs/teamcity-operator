# The password of the teamcity Postgres role, applied before the database: the
# Percona operator creates the role from this Secret (it needs only the
# 'password' key) and enriches it with the connection details. If the Secret
# is missing, the operator makes up a random password instead.
apiVersion: v1
kind: Namespace
metadata:
  name: teamcity
---
apiVersion: v1
kind: Secret
metadata:
  name: teamcity-pg-credentials
  namespace: teamcity
type: Opaque
stringData:
  # Also in values/teamcity.yaml, for TeamCity to connect.
  password: teamcity
