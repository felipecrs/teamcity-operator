crVersion: 3.1.0
postgresVersion: 18
instances:
  - name: instance1
    replicas: 2
    dataVolumeClaimSpec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
proxy:
  pgBouncer:
    replicas: 1
backups:
  enabled: false
logcollector:
  enabled: false
users:
  # Not a superuser: PgBouncer refuses to authenticate those.
  - name: teamcity
    databases:
      - teamcity
    grantPublicSchemaAccess: true
    password:
      type: ASCII
    secretName: teamcity-pg-credentials
