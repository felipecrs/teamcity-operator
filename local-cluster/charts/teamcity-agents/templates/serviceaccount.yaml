{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "teamcity-agents.serviceAccountName" . }}
  labels:
    {{- include "teamcity-agents.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# TeamCity uses this account from outside, no pod runs with it.
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "teamcity-agents.serviceAccountName" . }}-token
  labels:
    {{- include "teamcity-agents.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ include "teamcity-agents.serviceAccountName" . }}
type: kubernetes.io/service-account-token
{{- end }}
