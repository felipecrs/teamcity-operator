{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "teamcity.fullname" . }}-database
  labels:
    {{- include "teamcity.labels" . | nindent 4 }}
type: Opaque
stringData:
  connectionUrl: {{ required "database.connectionUrl is required" .Values.database.connectionUrl | quote }}
  connectionProperties.user: {{ required "database.user is required" .Values.database.user | quote }}
  connectionProperties.password: {{ required "database.password is required" .Values.database.password | quote }}
{{- end }}
