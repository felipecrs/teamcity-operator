apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-database
  labels:
    {{- include "teamcity.labels" . | nindent 4 }}
stringData:
  connectionUrl: {{ .Values.database.connectionUrl | quote }}
  connectionProperties.user: {{ .Values.database.user | quote }}
  connectionProperties.password: {{ .Values.database.password | quote }}
---
apiVersion: jetbrains.com/v1beta1
kind: TeamCity
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "teamcity.nodeLabels" . | nindent 4 }}
spec:
  image: {{ .Values.image }}
  databaseSecret:
    secret: {{ .Release.Name }}-database
  {{- with .Values.startupProperties }}
  startupPropertiesConfig:
    {{- range $name, $value := . }}
    {{ $name }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
  dataDirVolumeClaim:
    name: {{ .Release.Name }}-data-dir
    volumeMount:
      name: data-dir
      mountPath: /storage
    spec:
      # Shared by all the nodes, so it needs ReadWriteMany on a multi-node cluster.
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: {{ .Values.dataDirSize }}
  mainNode:
    name: {{ .Values.mainNode.name }}
    spec:
      {{- toYaml .Values.mainNode.spec | nindent 6 }}
  {{- with .Values.secondaryNodes }}
  secondaryNodes:
    {{- range . }}
    - name: {{ .name }}
      spec:
        {{- toYaml .spec | nindent 8 }}
        # A node connecting while the main one takes its database lock stops at
        # "Second TeamCity instance detected" until an administrator steps in.
        initContainers:
          - name: wait-for-main-node
            image: {{ $.Values.image }}
            command:
              - sh
              - -c
              - until curl -sf -o /dev/null http://{{ $.Values.mainNode.name }}-0/healthCheck/ready; do sleep 5; done
    {{- end }}
  {{- end }}
