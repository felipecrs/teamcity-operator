apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "teamcity.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8111
  selector:
    {{- include "teamcity.proxyLabels" . | nindent 4 }}
{{- /*
The operator sets the root URL of each node to http://<pod>.<namespace>, which
the nodes and the proxy use to reach it.
*/}}
{{- range prepend .Values.secondaryNodes .Values.mainNode }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}-0
  labels:
    {{- include "teamcity.labels" $ | nindent 4 }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8111
  selector:
    {{- include "teamcity.nodeLabels" $ | nindent 4 }}
    statefulset.kubernetes.io/pod-name: {{ .name }}-0
{{- end }}
