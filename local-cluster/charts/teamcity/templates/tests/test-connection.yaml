apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-connection
  labels:
    {{- include "teamcity.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
spec:
  containers:
    - name: wget
      image: busybox:1.37
      command: [wget, -O-, http://{{ .Release.Name }}/healthCheck/ready]
  restartPolicy: Never
